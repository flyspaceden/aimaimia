n:0;color:var(--muted)}.sub{font-size:13px}.rail{background:#fff;border:1px solid var(--line);display:flex;gap:0;margin-bottom:20px;border-radius:6px}.rail>div{padding:16px 24px;flex:1}.rail>div+div{border-left:1px solid var(--line)}.rail span{display:block;color:var(--muted);font-size:12px}.rail strong{font-size:23px;font-weight:600;display:block;margin-top:3px;font-variant-numeric:tabular-nums}.rail .warn strong{color:var(--orange)}.paper{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.tabs{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;padding:14px 0;color:var(--muted);border-bottom:2px solid transparent}.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.toolbar{padding:20px 22px 16px}.searchline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.searchline input[type=search]{width:min(430px,100%);flex:1;min-width:230px}.searchline .grow{flex:1}.toolbar input,.toolbar select,.form input,.form select{border:1px solid #d4d9e1;border-radius:6px;padding:8px 11px;background:#fff;color:var(--ink);height:39px}.quick{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.quick button{padding:5px 12px;background:#f8fafc;border-color:transparent;font-size:13px}.quick button.on{color:var(--blue);border-color:#bfd0fa;background:#eef3ff}.count{font-size:12px;margin-left:6px;opacity:.75}.advanced{display:none;padding-top:16px;gap:18px;align-items:center;flex-wrap:wrap}.advanced.open{display:flex}.advanced label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.applied{font-size:12px;color:var(--muted);padding-top:12px;display:flex;gap:8px;align-items:center}.applied:empty{display:none}.chip{background:#f1f5f9;padding:3px 9px;border-radius:4px}.tablebox{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{background:#f8fafc;color:#526174;font-weight:500;font-size:12px;text-align:left;padding:12px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:16px 18px;border-bottom:1px solid #eef0f3;vertical-align:middle}tbody tr:hover{background:#fafcff}.num{text-align:right;font-variant-numeric:tabular-nums}.name{color:var(--blue);font-weight:550;cursor:pointer}.secondary{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:4px;font-size:12px;background:#f1f5f9;color:#596579}.tag.blue{background:#edf3ff;color:var(--blue)}.tag.orange{background:#fff7ed;color:var(--orange)}.tag.green{background:#eff8f1;color:#287848}.tag.red{background:#fff1f2;color:var(--red)}.positive{color:#287848}.negative{color:var(--red)}.rowtools{display:flex;align-items:center;gap:6px;justify-content:flex-end}.rowtools select{border:0;color:var(--muted);font-size:12px;background:transparent;width:58px}.foot{padding:13px 22px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);align-items:center}.empty{padding:48px;text-align:center;white-space:normal}.empty b{display:block;color:var(--ink);margin-bottom:7px}.empty button{margin-top:16px}.note{font-size:12px;margin-top:14px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#00152955;z-index:10;display:none;justify-content:flex-end}.overlay.open{display:flex}.drawer{background:#fff;width:760px;max-width:100%;height:100dvh;display:flex;flex-direction:column;box-shadow:-8px 0 28px #00152914}.dhead{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.dhead .close{border:0;background:#f1f5f9;padding:2px 12px;font-size:22px}.dbody{padding:22px 26px;overflow:auto;flex:1}.dfoot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#f8fafc;padding:18px;border-radius:5px}.detailgrid label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detailgrid .amount{font-size:25px;font-variant-numeric:tabular-nums}.banner{background:#f0f5ff;border-left:3px solid var(--blue);padding:12px 14px;color:#42516a;font-size:13px;margin-bottom:20px}.banner.warning{background:#fff8ee;border-color:#e69a37}.form label{display:block;margin-bottom:6px;font-size:13px}.form input:not([type=checkbox]),.form select{width:100%;margin-bottom:17px}.form .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.form .step{border-top:1px solid var(--line);padding-top:18px;margin-top:7px}.checkline{display:flex!important;gap:9px;align-items:center;margin-bottom:18px!important}.timeline{padding-left:16px;border-left:2px solid #e6ecf6;margin-left:4px}.timeline div{margin:14px 0}.timeline small{display:block;color:var(--muted)}.error{color:var(--red);font-size:13px;margin-bottom:14px;min-height:20px}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:white;box-shadow:0 4px 24px #10203925;padding:12px 20px;border-radius:6px;z-index:20;display:none}.toast.show{display:block}.drawer .tabs{padding:0;gap:22px;margin:18px 0}.drawer th,.drawer td{padding:12px 10px}.badge{font-size:12px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:170px 1fr}.main{padding:20px}.side{padding:22px 8px}.rail>div{padding:14px}.rail strong{font-size:20px}.rowtools{min-width:160px}}@media(max-width:720px){.layout{display:block}.side{position:static;height:auto;padding:12px;display:flex;gap:4px;flex-wrap:wrap}.side .brand,.side .section,.side .minor{display:none}.side button{width:auto;flex:1;font-size:13px;text-align:center;padding:8px}.top{height:auto;min-height:52px;padding:10px 16px;gap:8px}.demo{font-size:10px}.main{padding:18px 12px}.title{gap:8px}h1{font-size:21px}.title .sub{max-width:250px}.rail{flex-wrap:wrap}.rail>div{min-width:33%;padding:12px}.rail strong{font-size:18px}.toolbar{padding:16px}.searchline input[type=search]{min-width:180px}.drawer{width:100%}.dhead,.dbody,.dfoot{padding:18px}.form .fields{grid-template-columns:1fr}.detailgrid{gap:12px}.foot{padding:12px}.advanced label{flex-wrap:wrap}.top .user{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.layout>div{min-width:0}.tablebox th{position:sticky;top:0;z-index:1}.tablebox th:last-child{position:sticky;right:0;background:#f8fafc;z-index:2}.tablebox td:last-child{position:sticky;right:0;background:#fff}.tablebox tbody tr:hover td:last-child{background:#fafcff}

@media(max-width:720px){
.tablebox th,.tablebox td{padding:12px 9px}.tablebox th:last-child,.tablebox td:last-child{position:static}.tablebox td:first-child{white-space:normal}.rowtools{min-width:0;gap:0}.rowtools button:not(.link),.rowtools select{display:none}.rowtools .link{padding:4px}
body[data-page="companies"] .tablebox th:nth-child(n+3):nth-child(-n+6),body[data-page="companies"] .tablebox td:nth-child(n+3):nth-child(-n+6){display:none}
body[data-page="funds"] .tablebox th:nth-child(n+2):nth-child(-n+4),body[data-page="funds"] .tablebox td:nth-child(n+2):nth-child(-n+4){display:none}
body[data-page="payments"] .tablebox th:nth-child(2),body[data-page="payments"] .tablebox td:nth-child(2),body[data-page="payments"] .tablebox th:nth-child(5),body[data-page="payments"] .tablebox td:nth-child(5){display:none}

</style></head><body>
<div class="layout"><aside class="side"><div class="brand">爱买买<small>平台管理后台</small></div><div class="minor">工作台</div><div class="minor">用户与奖励</div><div class="section">资金管理</div><button data-nav="funds">基金账本</button><button data-nav="companies">公司产业基金</button><button data-nav="payments">公对公付款</button><div class="minor">交易与售后</div><div class="minor">系统管理</div></aside><div><header class="top"><span id="crumb">资金管理 / 基金账本</span><span class="demo">设计预览 · 示例数据 · 请勿填写真实银行信息</span><span class="user">财务工作区</span></header><main class="main" id="main"></main></div></div>
<div class="overlay" id="overlay" role="presentation"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="dhead"><div><h2 id="drawer-title"></h2><p class="sub" id="drawer-sub"></p></div><button class="close" id="close" aria-label="关闭详情">×</button></div><div class="dbody" id="dbody"></div><footer class="dfoot" id="dfoot"></footer></section></div><div class="toast" role="status" id="toast"></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const companies=[{id:'c1',name:'示例 · 丰禾农业',frozen:2400,available:12800,reserved:3200,paid:28600,due:0,time:'2026-09-09',note:'正常结算'},{id:'c2',name:'示例 · 山野鲜果',frozen:1800,available:0,reserved:4800,paid:12600,due:0,time:'2026-09-08',note:'1 笔付款需要核实'},{id:'c3',name:'示例 · 沃田农产',frozen:900,available:4600,reserved:0,paid:18200,due:1200,time:'2026-09-07',note:'存在待追偿金额'}];
const funds=[{id:'industry',name:'产业基金',desc:'平台暂存 · 按公司归属',opening:28400,income:8700,expense:6600},{id:'charity',name:'慈善基金',desc:'平台独立账本',opening:7740,income:1200,expense:700},{id:'tech',name:'科技基金',desc:'平台独立账本',opening:10000,income:2800,expense:500},{id:'reserve',name:'备用金',desc:'平台独立账本',opening:15360,income:600,expense:300},{id:'profit',name:'平台利润',desc:'平台利润单独核算',opening:92800,income:18400,expense:12000}];
let payments=[{id:'示例付款 001',company:'c1',amount:3200,status:'RESERVED',review:false,time:'2026-09-09',bank:'',due:0},{id:'示例付款 002',company:'c2',amount:4800,status:'RESERVED',review:true,time:'2026-09-08',bank:'',due:0},{id:'示例付款 003',company:'c3',amount:1200,status:'PAID',review:false,time:'2026-09-07',bank:'示例银行流水 003',due:1200},{id:'示例付款 004',company:'c1',amount:9500,status:'PAID',review:false,time:'2026-09-06',bank:'示例银行流水 004',due:0}];
const state={page:'funds',funds:{q:'',tab:'current',from:'',to:''},companies:{q:'',tab:'accounts',quick:'all',from:'',to:''},payments:{q:'',quick:'all',from:'',to:''}};
let opener=null,activeCompany=null,companyTab='ledger';
const cn=id=>companies.find(c=>c.id===id);const statusText=p=>p.review?'需核实':({RESERVED:'待付款核实',PAID:'已登记付款',CANCELLED:'已取消',REVERSED:'已冲正'})[p.status];
const tag=p=>`<span class="tag ${p.review?'orange':p.status==='RESERVED'?'blue':p.status==='PAID'?'green':''}">${statusText(p)}</span>`;
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3200)}
function go(page){closeDrawer();state.page=page;location.hash=page;render()}
function closeDrawer(){document.querySelector('#overlay').classList.remove('open');document.body.style.overflow='';opener?.focus?.()}
function drawer(title,sub,body,footer=''){opener=document.activeElement;document.querySelector('#drawer-title').textContent=title;document.querySelector('#drawer-sub').textContent=sub;document.querySelector('#dbody').innerHTML=body;document.querySelector('#dfoot').innerHTML=footer||'<button data-close>关闭</button>';document.querySelector('#overlay').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#close').focus()}
function title(t,desc,action=''){return `<div class="title"><div><h1>${t}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function toolbar(placeholder){const s=state[state.page];const dateLabel=state.page==='funds'?'记账期间（示例 9 月）':state.page==='companies'?'最近记账时间':'创建时间';return `<div class="toolbar"><form class="searchline" id="search"><input type="search" aria-label="关键词搜索" placeholder="${placeholder}" value="${esc(s.q)}"><button class="primary">查询</button><button type="button" data-reset>重置</button><span class="grow"></span><button type="button" data-advanced>更多筛选</button></form><div class="advanced" id="advanced"><label>${dateLabel}<input type="date" aria-label="开始日期" id="from" value="${s.from}">至<input type="date" aria-label="结束日期" id="to" value="${s.to}"></label><button data-apply>应用日期</button></div><div class="applied">${s.q?`<span class="chip">关键词：${esc(s.q)}</span>`:''}${s.from||s.to?`<span class="chip">${s.from||'不限'} 至 ${s.to||'不限'}</span>`:''}</div></div>`}
function empty(){return '<tr><td colspan="10"><div class="empty"><b>没有找到符合条件的记录</b><p>试试缩短关键词，或清除当前筛选条件。</p><button data-reset>清除筛选</button></div></td></tr>'}
function foot(n){return `<div class="foot"><span>当前示例 ${n} 条</span><span>第 1 页 · 每页 20 条</span></div>`}
function inDate(date,s){return (!s.from||date>=s.from)&&(!s.to||date<=s.to)}
function render(){document.body.dataset.page=state.page;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));document.querySelector('#crumb').textContent='资金管理 / '+({funds:'基金账本',companies:'公司产业基金',payments:'公对公付款'})[state.page];const main=document.querySelector('#main');
if(state.page==='funds'){const s=state.funds;const list=s.tab==='current'?funds.filter(f=>f.name.includes(s.q)):[];main.innerHTML=title('基金账本','按基金查收支；产业基金属于公司应付，单独核算。','<button data-refresh>刷新</button>')+`<section class="paper"><div class="tabs"><button data-ftab="current" class="${s.tab==='current'?'on':''}">当前基金</button><button data-ftab="history" class="${s.tab==='history'?'on':''}">历史账本</button></div>${toolbar('搜索基金名称，如：慈善基金')}<div class="tablebox"><table><thead><tr><th>基金名称</th><th class="num">期初余额</th><th class="num">期间收入</th><th class="num">期间支出 / 冲回</th><th class="num">当前余额</th><th></th></tr></thead><tbody>${list.map(f=>{let flows=[{date:'2026-09-06',delta:f.income},{date:'2026-09-08',delta:-f.expense}];const filtered=flows.filter(e=>inDate(e.date,s));const opening=f.opening+flows.filter(e=>s.from&&e.date<s.from).reduce((a,e)=>a+e.delta,0);return `<tr><td><span class="name" data-fund="${f.id}">${f.name}</span><small class="secondary">${f.desc}</small></td><td class="num">${money(opening)}</td><td class="num">${money(filtered.filter(e=>e.delta>0).reduce((a,e)=>a+e.delta,0))}</td><td class="num">${money(-filtered.filter(e=>e.delta<0).reduce((a,e)=>a+e.delta,0))}</td><td class="num"><b>${money(f.opening+f.income-f.expense)}</b></td><td class="num"><button class="link" data-fund="${f.id}">查看流水</button></td></tr>`}).join('')|| (s.tab==='history'?'<tr><td colspan="6"><div class="empty"><b>历史账本独立保留</b><p>正式页面在这里查询旧基金池、积分池和旧平台产业基金。<br>本原型不载入历史业务数据。</p></div></td></tr>':empty())}</tbody></table></div>${foot(list.length)}</section><p class="note">期间筛选改变发生额；当前余额始终显示当前值。原型中的金额用于说明布局。</p>`}
else if(state.page==='companies'){const s=state.companies;const list=companies.filter(c=>c.name.includes(s.q)&&inDate(c.time,s)&&(s.quick==='all'||s.quick==='available'&&c.available>0||s.quick==='review'&&payments.some(p=>p.company===c.id&&p.review)||s.quick==='due'&&c.due>0));const sum=k=>list.reduce((a,c)=>a+c[k],0);main.innerHTML=title('公司产业基金','查公司应付、看来源明细，再进入付款登记。')+`<div class="rail"><div><span>当前筛选公司 · 可支付</span><strong>${money(sum('available'))}</strong></div><div><span>付款预留</span><strong>${money(sum('reserved'))}</strong></div><div class="warn"><span>待追偿</span><strong>${money(sum('due'))}</strong></div></div><section class="paper"><div class="tabs"><button data-ctab="accounts" class="${s.tab==='accounts'?'on':''}">公司账本</button><button data-ctab="unassigned" class="${s.tab==='unassigned'?'on':''}">待归属</button></div>${s.tab==='accounts'?`<div class="toolbar" style="padding-bottom:0"><div class="quick">${[['all','全部'],['available','有可支付金额'],['review','有待核实付款'],['due','有待追偿']].map(([v,t])=>`<button data-quick="${v}" class="${s.quick===v?'on':''}">${t}</button>`).join('')}</div></div>${toolbar('搜索公司名称，如：丰禾')}<div class="tablebox"><table><thead><tr><th>公司</th><th class="num">可支付</th><th class="num">售后冻结</th><th class="num">付款预留</th><th class="num">待追偿</th><th>最近变动</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><span class="name" data-company="${c.id}">${c.name}</span><span class="secondary">${c.due?'存在待追偿金额':payments.some(p=>p.company===c.id&&p.review)?'有付款需要核实':'正常结算'}</span></td><td class="num"><b>${money(c.available)}</b></td><td class="num">${money(c.frozen)}</td><td class="num">${money(c.reserved)}</td><td class="num ${c.due?'negative':''}">${money(c.due)}</td><td>${c.time}</td><td><div class="rowtools"><button class="link" data-company="${c.id}">查看</button><button data-create="${c.id}" ${c.due||!c.available?'disabled':''} title="${c.due?'存在待追偿，暂不能新建付款单':!c.available?'暂无可支付余额':'为该公司新建付款单'}">登记付款</button></div></td></tr>`).join('')||empty()}</tbody></table></div>${foot(list.length)}`:`<div class="empty"><b>待归属记录集中处理</b><p>正式页面显示来源订单、计提、冲回和待归属净额。<br>没有可靠来源证据时，只能查看，不直接划给某家公司。</p></div>`}</section><p class="note">公司余额是当前值，不根据订单期间重新计算。公司名称点击后可查看明细、付款和待处理事项。</p>`}
else{const s=state.payments;const base=payments.filter(p=>(cn(p.company).name+p.id+p.bank).includes(s.q)&&inDate(p.time,s));const modes=[['all','全部',base.length],['RESERVED','待付款核实',base.filter(p=>p.status==='RESERVED'&&!p.review).length],['review','需核实',base.filter(p=>p.review).length],['PAID','已登记付款',base.filter(p=>p.status==='PAID').length],['CANCELLED','已取消',base.filter(p=>p.status==='CANCELLED').length],['REVERSED','已冲正',base.filter(p=>p.status==='REVERSED').length]];const list=base.filter(p=>s.quick==='all'||s.quick==='review'&&p.review||s.quick==='RESERVED'&&p.status==='RESERVED'&&!p.review||!['review','RESERVED'].includes(s.quick)&&p.status===s.quick);main.innerHTML=title('公对公付款','先建立付款单并预留金额，银行转账完成后登记结果。','<button class="primary" data-create="">新建付款单</button>')+`<section class="paper"><div class="tabs">${modes.map(([v,t,n])=>`<button data-quick="${v}" class="${s.quick===v?'on':''}">${t}<span class="count">${n}</span></button>`).join('')}</div>${toolbar('搜索公司、付款单号或银行流水号')}<div class="tablebox"><table><thead><tr><th>付款单</th><th>收款公司</th><th class="num">金额</th><th>状态</th><th>创建时间</th><th class="num">操作</th></tr></thead><tbody>${list.map(p=>`<tr><td><span class="name" data-payment="${p.id}">${p.id}</span><span class="secondary mobile-only">${cn(p.company).name}</span><span class="secondary">${p.bank||'银行付款结果待登记'}</span></td><td><span class="name" data-company="${p.company}">${cn(p.company).name}</span></td><td class="num"><b>${money(p.amount)}</b></td><td>${tag(p)}${p.due?'<span class="secondary negative">待追偿 '+money(p.due)+'</span>':''}</td><td>${p.time}</td><td><div class="rowtools"><button class="link" data-payment="${p.id}">查看</button>${p.status==='RESERVED'?`<button data-confirm="${p.id}">${p.review?'核实付款':'确认已付款'}</button><select aria-label="更多付款操作" data-more="${p.id}"><option value="">更多</option><option value="correct">更正未付款单</option></select>`:''}</div></td></tr>`).join('')||empty()}</tbody></table></div>${foot(list.length)}</section><p class="note">已确认的付款不直接修改金额。错误登记使用冲正；实际退回款单独登记，保留全部历史。</p>`}
bindMain()}
function bindMain(){const searchForm=document.querySelector('#search');if(!searchForm)return;searchForm.onsubmit=e=>{e.preventDefault();state[state.page].q=e.target.querySelector('input').value.trim();render()};document.querySelector('[data-advanced]').onclick=()=>document.querySelector('#advanced').classList.toggle('open');document.querySelector('[data-apply]').onclick=()=>{const a=document.querySelector('#from').value,b=document.querySelector('#to').value;if(a&&b&&a>b)return toast('开始日期不能晚于结束日期');state[state.page].from=a;state[state.page].to=b;render()}}
function showFund(id){const f=funds.find(x=>x.id===id),s=state.funds;drawer(f.name+' · 逐笔流水','示例资金事件 · 只读',`<div class="banner">先看金额和来源，再展开计算依据；账本金额不能直接编辑。</div><div class="detailgrid"><div><label>当前余额</label><strong class="amount">${money(f.opening+f.income-f.expense)}</strong></div><div><label>账本归属</label>${f.desc}</div></div><h3>本次示例流水</h3><table><thead><tr><th>时间 / 事件</th><th>来源</th><th class="num">金额</th></tr></thead><tbody><tr><td>09-08 14:20<span class="secondary">支出 / 冲回</span></td><td>示例业务记录 02</td><td class="num negative">−${money(f.expense)}</td></tr><tr><td>09-06 10:35<span class="secondary">基金计提</span></td><td>示例订单 01</td><td class="num positive">+${money(f.income)}</td></tr></tbody></table><h3>查看方式</h3><p>正式流水页按订单号、流水号、记账时间和事件筛选。详情优先显示来源、实际计算依据、余额变化与关联记录，低频字段折叠。</p>`,id==='industry'?'<button data-close>关闭</button><button class="primary" data-nav="companies">查看公司子账</button>':'<button data-close>返回基金列表</button>')}
function companyPanel(id,tab='ledger'){const c=cn(id);activeCompany=id;companyTab=tab;let body=`<div class="detailgrid"><div><label>可支付</label><strong class="amount">${money(c.available)}</strong></div><div><label>待追偿</label><strong class="amount ${c.due?'negative':''}">${money(c.due)}</strong></div><div><label>售后冻结</label>${money(c.frozen)}</div><div><label>付款预留</label>${money(c.reserved)}</div></div><div class="tabs">${[['ledger','资金明细'],['payments','付款记录'],['issues','待处理事项']].map(([v,t])=>`<button data-company-tab="${v}" class="${v===tab?'on':''}">${t}</button>`).join('')}</div>`;
if(tab==='ledger')body+='<div class="banner">这里直接限定为当前公司，按订单和记账时间查找；明细金额只读。</div><table><thead><tr><th>事件</th><th>关联记录</th><th class="num">示例金额</th></tr></thead><tbody><tr><td>售后保护冻结</td><td>示例订单 A</td><td class="num">'+money(c.frozen)+'</td></tr><tr><td>付款预留</td><td>查看付款记录标签</td><td class="num">'+money(c.reserved)+'</td></tr></tbody></table>';
if(tab==='payments')body+=`<table><thead><tr><th>付款单</th><th>状态</th><th class="num">金额</th><th></th></tr></thead><tbody>${payments.filter(p=>p.company===id).map(p=>`<tr><td>${p.id}</td><td>${tag(p)}</td><td class="num">${money(p.amount)}</td><td><button class="link" data-payment="${p.id}">查看</button></td></tr>`).join('')}</tbody></table>`;
if(tab==='issues')body+=c.due?`<div class="banner warning">该公司有 ${money(c.due)} 待追偿。新付款入口暂停，先在对应付款单登记核实后的实际回款。</div>`:payments.some(p=>p.company===id&&p.review)?'<div class="banner warning">有一笔付款涉及售后，先核实是否已经线下转账，再选择正确的登记流程。</div>':'<div class="empty"><b>当前没有待处理事项</b><p>仍可查看历史付款和资金明细。</p></div>';
drawer(c.name,'公司产业基金子账',body,`<button data-company-payments="${id}">查看全部付款</button><button class="primary" data-create="${id}" ${c.due||!c.available?'disabled':''}>登记付款</button>`)}
function showPayment(id){const p=payments.find(x=>x.id===id),c=cn(p.company);drawer(p.id,c.name,`${p.review?'<div class="banner warning">需要核实银行实际付款状态。已真实付款不能直接当作“未付款”取消。</div>':''}<div class="detailgrid"><div><label>付款金额</label><strong class="amount">${money(p.amount)}</strong></div><div><label>当前状态</label>${tag(p)}</div><div><label>收款主体</label>${c.name}</div><div><label>对公账号</label>示例账号 · 尾号 ${p.account?esc(p.account.slice(-4)):'4821'}</div></div><h3>核销与凭证</h3><p>正式详情展示关联订单及各自核销金额；完整账号、银行流水和附件按权限查看。</p><table><tbody><tr><td>银行流水</td><td>${esc(p.bank||'尚未登记')}</td></tr><tr><td>待追偿</td><td>${money(p.due)}</td></tr></tbody></table><h3>操作历史</h3><div class="timeline"><div>建立付款单并预留 ${money(p.amount)}<small>${p.time} · 示例经办人</small></div>${p.status==='PAID'?'<div>已登记线下付款<small>凭证和核销记录保留</small></div>':''}${p.review?'<div>售后触发付款核实<small>待核实是否实际转账</small></div>':''}</div><h3>可编辑范围</h3><p>${p.status==='RESERVED'?'如资料填错，先核实未线下付款，再取消旧单并预填新单；不覆盖原记录。':'已登记的金额和收款快照不直接编辑。错误登记走冲正，实际退回款走回款登记。'}</p>`,`<button data-close>关闭</button>${p.status==='RESERVED'?`<button class="primary" data-confirm="${id}">${p.review?'核实付款':'确认已付款'}</button>`:''}`)}
function showCreate(companyId='',oldId=''){const old=payments.find(p=>p.id===oldId),c=companyId?cn(companyId):null;if(c&&(c.due||(!c.available&&!old)))return toast(c.due?'存在待追偿，请先处理回款':'该公司暂无可支付余额');drawer(old?'更正未付款单':'新建付款单',old?'核实未付款后，取消旧单并建立新单':'表单创建前可以编辑；不直接修改历史账本',`<div class="banner">这是设计原型，表单只使用示例公司，操作不会发起真实转账或保存到服务器。</div><form class="form" id="create-form"><div class="error" id="form-error" role="alert"></div>${old?'<label class="checkline"><input type="checkbox" id="not-paid" required>已核实这笔旧单尚未在线下银行付款</label>':''}<h3 style="margin-top:0">公司与金额</h3><label for="company">收款公司</label><select id="company" required><option value="">请选择公司</option>${companies.map(x=>`<option value="${x.id}" ${x.id===companyId?'selected':''} ${x.due||(!x.available&&x.id!==companyId)?'disabled':''}>${x.name}</option>`).join('')}</select><p id="available" class="sub" style="margin-bottom:14px">${c?'当前可支付 '+money(c.available+(old?old.amount:0)):'选择公司后显示可支付余额'}</p><label for="amount">预留金额（元）</label><input id="amount" type="number" min="0.01" step="0.01" value="${old?old.amount:''}" required placeholder="请输入金额"><div class="step"><h3 style="margin-top:0">对公收款资料</h3><label for="payee">对公户名</label><input id="payee" readonly value="${c?esc(c.name):''}" placeholder="按公司主体显示"><div class="fields"><div><label for="bank">开户行</label><input id="bank" required placeholder="填写示例开户行"></div><div><label for="account">对公账号</label><input id="account" required inputmode="numeric" pattern="[0-9]{6,32}" placeholder="请勿填写真实账号"></div></div><label for="reason">登记原因</label><input id="reason" required maxlength="500" placeholder="说明本次付款用途"></div></form>`,`<button data-close>取消</button><button class="primary" id="save-create">${old?'取消旧单并创建新单':'创建并预留'}</button>`);
document.querySelector('#company').onchange=e=>{const x=cn(e.target.value);document.querySelector('#payee').value=x?.name||'';document.querySelector('#available').textContent=x?'当前可支付 '+money(x.available+(old&&old.company===x.id?old.amount:0)):'选择公司后显示可支付余额'};
document.querySelector('#save-create').onclick=()=>{const form=document.querySelector('#create-form');if(!form.reportValidity())return;const x=cn(document.querySelector('#company').value),amount=Number(document.querySelector('#amount').value),limit=x.available+(old&&old.company===x.id?old.amount:0);if(!Number.isFinite(amount)||amount<=0||amount>limit){document.querySelector('#form-error').textContent='金额需大于零且不超过可支付余额 '+money(limit);return}if(old){old.status='CANCELLED';old.review=false;const previous=cn(old.company);previous.available+=old.amount;previous.reserved-=old.amount}x.available-=amount;x.reserved+=amount;const p={id:'示例付款 '+String(payments.length+1).padStart(3,'0'),company:x.id,account:document.querySelector('#account').value,bankName:document.querySelector('#bank').value,amount,status:'RESERVED',review:false,time:'2026-09-09',bank:'',due:0};payments.unshift(p);state.payments.q=x.name;state.payments.quick='all';go('payments');toast('原型已创建付款单并预留 '+money(amount)+'，未连接业务系统');showPayment(p.id)}}
function showConfirm(id){const p=payments.find(x=>x.id===id);drawer(p.review?'核实付款事实':'确认已付款',p.id+' · '+money(p.amount),`<div class="banner ${p.review?'warning':''}">本原型仅展示确认流程。正式操作必须核对银行实际结果，并提供对应凭证；不会在此发起银行转账。</div><div class="detailgrid"><div><label>收款公司</label>${cn(p.company).name}</div><div><label>应核对金额</label>${money(p.amount)}</div></div><h3>确认前需要的资料</h3><div class="timeline"><div>实际付款时间<small>使用银行回单上的时间</small></div><div>付款账户标识与银行流水号<small>用于避免重复登记</small></div><div>私有付款凭证<small>上传 PDF 或图片，并按权限查看</small></div>${p.review?'<div>核实结论和原因<small>明确是否已真实付款；已付款时后续可能进入追偿</small></div>':''}</div><h3>页面处理方式</h3><p>正式版在此填写资料并进行校验。此处停止在预览，不改变这笔示例付款的状态。</p>`,`<button data-payment="${id}">返回付款详情</button><button class="primary" data-close>完成预览</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-fund],[data-company],[data-payment]');if(!b||b.disabled)return;if(b.hasAttribute('data-nav'))go(b.dataset.nav);else if(b.hasAttribute('data-close'))closeDrawer();else if(b.hasAttribute('data-reset')){const s=state[state.page];s.q='';s.from='';s.to='';if(s.quick)s.quick='all';render()}else if(b.hasAttribute('data-refresh'))toast('已刷新原型中的示例数据');else if(b.hasAttribute('data-quick')){state[state.page].quick=b.dataset.quick;render()}else if(b.hasAttribute('data-ftab')){state.funds.tab=b.dataset.ftab;render()}else if(b.hasAttribute('data-ctab')){state.companies.tab=b.dataset.ctab;render()}else if(b.hasAttribute('data-fund'))showFund(b.dataset.fund);else if(b.hasAttribute('data-company'))companyPanel(b.dataset.company);else if(b.hasAttribute('data-payment'))showPayment(b.dataset.payment);else if(b.hasAttribute('data-create')){const id=b.dataset.create;if(state.page!=='payments'){state.payments.q=id?cn(id).name:'';go('payments')}showCreate(id)}else if(b.hasAttribute('data-confirm'))showConfirm(b.dataset.confirm);else if(b.hasAttribute('data-company-tab'))companyPanel(activeCompany,b.dataset.companyTab);else if(b.hasAttribute('data-company-payments')){state.payments.q=cn(b.dataset.companyPayments).name;state.payments.quick='all';go('payments')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-more]')&&e.target.value==='correct'){const p=payments.find(x=>x.id===e.target.dataset.more);e.target.value='';showCreate(p.company,p.id)}});
document.querySelector('#close').onclick=closeDrawer;document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Tab'&&document.querySelector('#overlay').classList.contains('open')){const list=[...document.querySelectorAll('.drawer button:not([disabled]),.drawer input,.drawer select')].filter(x=>x.getClientRects().length);const a=list[0],z=list.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['funds','companies','payments'].includes(p)&&p!==state.page){state.page=p;closeDrawer();render()}});if(['funds','companies','payments'].includes(location.hash.slice(1)))state.page=location.hash.slice(1);render();
