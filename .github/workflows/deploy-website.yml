name: Deploy Sites & Backend

on:
  push:
    branches: [main, staging]
    paths:
      - 'website/**'
      - 'admin/**'
      - 'delivery-admin/**'
      - 'seller/**'
      - 'delivery-seller/**'
      - 'backend/**'
      - 'huahai-corporate-site/**'
      - 'src/content/legal/**'
      - 'scripts/lib/legal-static-renderer.mjs'
      - 'scripts/sync-huahai-legal.mjs'
      - '.github/workflows/deploy-website.yml'

  # 手动触发
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目标 (all/website/admin/delivery-admin/seller/delivery-seller/backend/huahai)'
        required: true
        default: 'all'

# 同一分支的服务器发布必须串行，避免两个 run 同时 reset、迁移、改 .env 或重载 PM2。
concurrency:
  group: deploy-sites-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.changes.outputs.website }}
      admin: ${{ steps.changes.outputs.admin }}
      delivery_admin: ${{ steps.changes.outputs.delivery_admin }}
      seller: ${{ steps.changes.outputs.seller }}
      delivery_seller: ${{ steps.changes.outputs.delivery_seller }}
      backend: ${{ steps.changes.outputs.backend }}
      huahai: ${{ steps.changes.outputs.huahai }}
      env_name: ${{ steps.env.outputs.env_name }}
      api_base: ${{ steps.env.outputs.api_base }}
      ws_base: ${{ steps.env.outputs.ws_base }}
      admin_target: ${{ steps.env.outputs.admin_target }}
      delivery_admin_target: ${{ steps.env.outputs.delivery_admin_target }}
      seller_target: ${{ steps.env.outputs.seller_target }}
      delivery_seller_target: ${{ steps.env.outputs.delivery_seller_target }}
      website_target: ${{ steps.env.outputs.website_target }}
      backend_src_dir: ${{ steps.env.outputs.backend_src_dir }}
      backend_pm2_name: ${{ steps.env.outputs.backend_pm2_name }}
      backend_branch: ${{ steps.env.outputs.backend_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 拉完整历史，保证 diff 能覆盖任意 push 范围
          # （之前 fetch-depth: 2 在「一次 push 多 commit」时会漏识别中间 commit 的改动）
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.deploy_target }}"
            [ "$TARGET" = "all" ] || [ "$TARGET" = "website" ] && echo "website=true" >> $GITHUB_OUTPUT || echo "website=false" >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "admin" ]   && echo "admin=true"   >> $GITHUB_OUTPUT || echo "admin=false"   >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "delivery-admin" ] && echo "delivery_admin=true" >> $GITHUB_OUTPUT || echo "delivery_admin=false" >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "seller" ]  && echo "seller=true"  >> $GITHUB_OUTPUT || echo "seller=false"  >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "delivery-seller" ] && echo "delivery_seller=true" >> $GITHUB_OUTPUT || echo "delivery_seller=false" >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "backend" ] && echo "backend=true" >> $GITHUB_OUTPUT || echo "backend=false" >> $GITHUB_OUTPUT
            [ "$TARGET" = "all" ] || [ "$TARGET" = "huahai" ]  && echo "huahai=true"  >> $GITHUB_OUTPUT || echo "huahai=false"  >> $GITHUB_OUTPUT
          else
            # diff 本次 push 的完整范围（before..after），覆盖一次推多 commit 的情况
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # 首次 push 到新分支，before 是全零，降级为只看最新 commit
              CHANGED=$(git show --name-only --pretty=format: HEAD)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
            echo "$CHANGED" | grep -Eq '^(website/|scripts/lib/legal-static-renderer\.mjs$)' && echo "website=true" >> $GITHUB_OUTPUT || echo "website=false" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^admin/'   && echo "admin=true"   >> $GITHUB_OUTPUT || echo "admin=false"   >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^delivery-admin/' && echo "delivery_admin=true" >> $GITHUB_OUTPUT || echo "delivery_admin=false" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^seller/'  && echo "seller=true"  >> $GITHUB_OUTPUT || echo "seller=false"  >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^delivery-seller/' && echo "delivery_seller=true" >> $GITHUB_OUTPUT || echo "delivery_seller=false" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -q '^backend/' && echo "backend=true" >> $GITHUB_OUTPUT || echo "backend=false" >> $GITHUB_OUTPUT
            echo "$CHANGED" | grep -Eq '^(huahai-corporate-site/|src/content/legal/|scripts/lib/legal-static-renderer\.mjs$|scripts/sync-huahai-legal\.mjs$)' && echo "huahai=true" >> $GITHUB_OUTPUT || echo "huahai=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment (main → 生产 / staging → 测试)
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "api_base=https://api.ai-maimai.com/api/v1" >> $GITHUB_OUTPUT
            echo "ws_base=https://api.ai-maimai.com" >> $GITHUB_OUTPUT
            echo "admin_target=/www/wwwroot/admin/" >> $GITHUB_OUTPUT
            echo "delivery_admin_target=/www/wwwroot/delivery-admin/" >> $GITHUB_OUTPUT
            echo "seller_target=/www/wwwroot/seller/" >> $GITHUB_OUTPUT
            echo "delivery_seller_target=/www/wwwroot/delivery-seller/" >> $GITHUB_OUTPUT
            echo "website_target=/www/wwwroot/website/" >> $GITHUB_OUTPUT
            echo "backend_src_dir=/www/wwwroot/aimaimai-prod-src" >> $GITHUB_OUTPUT
            echo "backend_pm2_name=aimaimai-api-prod" >> $GITHUB_OUTPUT
            echo "backend_branch=main" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "api_base=https://test-api.ai-maimai.com/api/v1" >> $GITHUB_OUTPUT
            echo "ws_base=https://test-api.ai-maimai.com" >> $GITHUB_OUTPUT
            echo "admin_target=/www/wwwroot/test-admin/" >> $GITHUB_OUTPUT
            echo "delivery_admin_target=/www/wwwroot/test-delivery-admin/" >> $GITHUB_OUTPUT
            echo "seller_target=/www/wwwroot/test-seller/" >> $GITHUB_OUTPUT
            echo "delivery_seller_target=/www/wwwroot/test-delivery-seller/" >> $GITHUB_OUTPUT
            echo "website_target=/www/wwwroot/website/" >> $GITHUB_OUTPUT
            echo "backend_src_dir=/www/wwwroot/aimaimai-staging-src" >> $GITHUB_OUTPUT
            echo "backend_pm2_name=aimaimai-api-test" >> $GITHUB_OUTPUT
            echo "backend_branch=staging" >> $GITHUB_OUTPUT
          fi

  deploy-website:
    needs: detect-changes
    # 锁死只有 main 才能部署 website，避免 staging 推送覆盖生产产物（与 deploy-huahai 同处理）
    if: needs.detect-changes.outputs.website == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      # 2026-06-04：生产 backend 已上线，website build 恢复动态 api_base（main→api.ai-maimai.com / staging→test-api）。
      # 历史：2026-04-22 生产 backend 未上线、生产 api 502 时曾临时写死指向 test-api，现已恢复（plan.md C40）。
      - name: Build website
        env:
          VITE_API_BASE_URL: ${{ needs.detect-changes.outputs.api_base }}
          VITE_APP_ENV: ${{ needs.detect-changes.outputs.env_name }}
        run: |
          cd website
          npm ci
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: website/dist/
          TARGET: ${{ needs.detect-changes.outputs.website_target }}
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'

  deploy-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Build admin
        env:
          VITE_API_BASE_URL: ${{ needs.detect-changes.outputs.api_base }}
          VITE_WS_BASE_URL: ${{ needs.detect-changes.outputs.ws_base }}
          VITE_APP_ENV: ${{ needs.detect-changes.outputs.env_name }}
        run: |
          cd admin
          npm ci
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: admin/dist/
          TARGET: ${{ needs.detect-changes.outputs.admin_target }}
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'

  deploy-delivery-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.delivery_admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: delivery-admin/package-lock.json

      - name: Build delivery-admin
        env:
          VITE_API_BASE_URL: ${{ needs.detect-changes.outputs.api_base }}
          VITE_WS_BASE_URL: ${{ needs.detect-changes.outputs.ws_base }}
          VITE_APP_ENV: ${{ needs.detect-changes.outputs.env_name }}
        run: |
          cd delivery-admin
          npm ci
          npm test
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: delivery-admin/dist/
          TARGET: ${{ needs.detect-changes.outputs.delivery_admin_target }}
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'

  deploy-seller:
    needs: detect-changes
    if: needs.detect-changes.outputs.seller == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: seller/package-lock.json

      - name: Build seller
        env:
          VITE_API_BASE_URL: ${{ needs.detect-changes.outputs.api_base }}
          VITE_WS_BASE_URL: ${{ needs.detect-changes.outputs.ws_base }}
          VITE_APP_ENV: ${{ needs.detect-changes.outputs.env_name }}
        run: |
          cd seller
          npm ci
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: seller/dist/
          TARGET: ${{ needs.detect-changes.outputs.seller_target }}
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'

  deploy-delivery-seller:
    needs: detect-changes
    if: needs.detect-changes.outputs.delivery_seller == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: delivery-seller/package-lock.json

      - name: Build delivery-seller
        env:
          VITE_API_BASE_URL: ${{ needs.detect-changes.outputs.api_base }}
          VITE_WS_BASE_URL: ${{ needs.detect-changes.outputs.ws_base }}
          VITE_APP_ENV: ${{ needs.detect-changes.outputs.env_name }}
        run: |
          cd delivery-seller
          npm ci
          npm test
          npm run build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: delivery-seller/dist/
          TARGET: ${{ needs.detect-changes.outputs.delivery_seller_target }}
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend on server
        env:
          SRC_DIR: ${{ needs.detect-changes.outputs.backend_src_dir }}
          PM2_NAME: ${{ needs.detect-changes.outputs.backend_pm2_name }}
          BRANCH: ${{ needs.detect-changes.outputs.backend_branch }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "SRC_DIR='$SRC_DIR' PM2_NAME='$PM2_NAME' BRANCH='$BRANCH' bash -s" <<'REMOTE'
            set -euo pipefail
            echo "═══ 1. 切换到源码目录 ═══"
            cd "$SRC_DIR"
            PREVIOUS_SHA=$(git rev-parse HEAD)
            DEPLOY_COMPLETE=false

            health_check() {
              API_PORT=$(sed -n 's/^PORT=//p' .env | tail -n 1 | tr -d '\r"')
              case "$API_PORT" in
                ''|*[!0-9]*) API_PORT=3000 ;;
              esac
              API_HEALTH_URL="http://127.0.0.1:${API_PORT}/api/v1/products?page=1&pageSize=1"
              for attempt in $(seq 1 15); do
                if curl --fail --silent --show-error "$API_HEALTH_URL" >/dev/null; then
                  echo "✅ API 健康检查通过（第 $attempt 次）"
                  return 0
                fi
                sleep 2
              done
              echo "❌ API 健康检查失败：$API_HEALTH_URL"
              return 1
            }

            rollback_backend() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ] && [ "$DEPLOY_COMPLETE" != true ]; then
                echo "═══ 部署失败，恢复旧代码 $PREVIOUS_SHA ═══"
                set +e
                cd "$SRC_DIR"
                git reset --hard "$PREVIOUS_SHA"
                cd backend
                npm ci \
                  && npx prisma generate \
                  && npx prisma generate --schema prisma-delivery/schema.prisma \
                  && npm run build \
                  && pm2 reload "$PM2_NAME" --update-env \
                  && health_check
                rollback_status=$?
                set -e
                if [ "$rollback_status" -eq 0 ]; then
                  echo "backend_rollback=healthy"
                else
                  echo "backend_rollback=failed"
                  pm2 describe "$PM2_NAME" || true
                  pm2 logs "$PM2_NAME" --lines 100 --nostream || true
                fi
              fi
              exit "$status"
            }
            trap rollback_backend EXIT

            echo "═══ 2. 拉取最新代码（branch: $BRANCH）═══"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "═══ 3. 装依赖 ═══"
            cd backend
            npm ci

            echo "═══ 4. Prisma generate + migrate deploy（主库 + 配送库）═══"
            npx prisma generate
            npx prisma migrate deploy
            npx prisma generate --schema prisma-delivery/schema.prisma
            npx prisma migrate deploy --schema prisma-delivery/schema.prisma

            echo "═══ 5. 构建 ═══"
            npm run build

            echo "═══ 6. PM2 reload ═══"
            pm2 reload "$PM2_NAME" --update-env

            echo "═══ 7. 验证健康检查 ═══"
            if ! health_check; then
              pm2 describe "$PM2_NAME" || true
              pm2 logs "$PM2_NAME" --lines 100 --nostream || true
              exit 1
            fi

            DEPLOY_COMPLETE=true
            echo "✅ 后端部署完成"
          REMOTE

  # 测试环境微信提现：代码部署成功后才写入非 Git 配置并重载。
  # WECHAT_TRANSFER_ENABLED 只控制新建；关闭后，后端仍保留查单/回调能力收口存量单据。
  configure-staging-wechat-transfer:
    needs: [detect-changes, deploy-backend]
    if: >-
      always()
      && github.ref == 'refs/heads/staging'
      && needs.detect-changes.outputs.backend == 'true'
      && needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validate protected staging inputs
        env:
          PUBLIC_KEY_ID: ${{ secrets.STAGING_WECHAT_PAY_PUBLIC_KEY_ID }}
          PUBLIC_KEY_PEM: ${{ secrets.STAGING_WECHAT_PAY_PUBLIC_KEY_PEM }}
          TRANSFER_ENABLED: ${{ secrets.STAGING_WECHAT_TRANSFER_ENABLED }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_KEY_ID"
          test -n "$PUBLIC_KEY_PEM"
          case "$TRANSFER_ENABLED" in true|false) ;; *) exit 1 ;; esac

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload protected WeChat public-key material
        env:
          PUBLIC_KEY_ID: ${{ secrets.STAGING_WECHAT_PAY_PUBLIC_KEY_ID }}
          PUBLIC_KEY_PEM: ${{ secrets.STAGING_WECHAT_PAY_PUBLIC_KEY_PEM }}
          TRANSFER_ENABLED: ${{ secrets.STAGING_WECHAT_TRANSFER_ENABLED }}
        run: |
          set -euo pipefail
          umask 077
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          printf '%s' "$PUBLIC_KEY_PEM" > "$TEMP_DIR/wechatpay_public_key.pem"
          printf '%s' "$PUBLIC_KEY_ID" > "$TEMP_DIR/wechatpay_public_key_id"
          printf '%s' "$TRANSFER_ENABLED" > "$TEMP_DIR/wechat_transfer_enabled"
          scp "$TEMP_DIR/wechatpay_public_key.pem" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/aimaimai_wechat_public_key_${GITHUB_RUN_ID}.pem
          scp "$TEMP_DIR/wechatpay_public_key_id" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/aimaimai_wechat_public_key_id_${GITHUB_RUN_ID}
          scp "$TEMP_DIR/wechat_transfer_enabled" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/aimaimai_wechat_transfer_enabled_${GITHUB_RUN_ID}

      - name: Configure and preflight staging WeChat transfer
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "RUN_ID='${GITHUB_RUN_ID}' bash -s" <<'REMOTE'
            set -euo pipefail
            umask 077
            BACKEND_DIR=/www/wwwroot/aimaimai-staging-src/backend
            PM2_NAME=aimaimai-api-test
            PUBLIC_KEY_TMP="/tmp/aimaimai_wechat_public_key_${RUN_ID}.pem"
            PUBLIC_KEY_ID_TMP="/tmp/aimaimai_wechat_public_key_id_${RUN_ID}"
            ENABLED_TMP="/tmp/aimaimai_wechat_transfer_enabled_${RUN_ID}"
            PUBLIC_KEY_TARGET="certs/wechat/wechatpay_public_key.pem"

            cd "$BACKEND_DIR"
            test -f .env
            BACKUP_FILE=".env.bak.wechat-transfer.${RUN_ID}"
            PUBLIC_KEY_BACKUP="${PUBLIC_KEY_TARGET}.bak.wechat-transfer.${RUN_ID}"
            cp -p .env "$BACKUP_FILE"
            HAD_PUBLIC_KEY=false
            if [ -f "$PUBLIC_KEY_TARGET" ]; then
              cp -p "$PUBLIC_KEY_TARGET" "$PUBLIC_KEY_BACKUP"
              HAD_PUBLIC_KEY=true
            fi
            cleanup_or_rollback() {
              status=$?
              trap - EXIT
              rm -f "$PUBLIC_KEY_TMP" "$PUBLIC_KEY_ID_TMP" "$ENABLED_TMP"
              if [ "$status" -ne 0 ]; then
                echo "staging_wechat_transfer_config=rollback"
                cp -p "$BACKUP_FILE" .env
                if [ "$HAD_PUBLIC_KEY" = true ]; then
                  cp -p "$PUBLIC_KEY_BACKUP" "$PUBLIC_KEY_TARGET"
                else
                  rm -f "$PUBLIC_KEY_TARGET"
                fi
                if pm2 reload "$PM2_NAME" --update-env >/dev/null 2>&1; then
                  API_PORT=$(sed -n 's/^PORT=//p' .env | tail -n 1 | tr -d '\r"')
                  case "$API_PORT" in ''|*[!0-9]*) API_PORT=3000 ;; esac
                  rollback_healthy=false
                  for attempt in $(seq 1 15); do
                    if curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/api/v1/products?page=1&pageSize=1" >/dev/null; then
                      rollback_healthy=true
                      break
                    fi
                    sleep 2
                  done
                  if [ "$rollback_healthy" = true ]; then
                    echo "staging_wechat_transfer_rollback=healthy"
                  else
                    echo "staging_wechat_transfer_rollback=failed"
                    pm2 logs "$PM2_NAME" --lines 100 --nostream || true
                  fi
                else
                  echo "staging_wechat_transfer_rollback=reload_failed"
                fi
              fi
              exit "$status"
            }
            trap cleanup_or_rollback EXIT
            mkdir -p certs/wechat
            chmod 700 certs/wechat
            install -m 600 "$PUBLIC_KEY_TMP" "$PUBLIC_KEY_TARGET"

            node <<'NODE'
            const fs = require('fs');
            const keyId = fs.readFileSync(`/tmp/aimaimai_wechat_public_key_id_${process.env.RUN_ID}`, 'utf8').trim();
            const enabled = fs.readFileSync(`/tmp/aimaimai_wechat_transfer_enabled_${process.env.RUN_ID}`, 'utf8').trim();
            const reportInfos = JSON.stringify([
              { info_type: '岗位类型', info_content: '平台推广人员' },
              { info_type: '报酬说明', info_content: 'AI爱买买平台推广佣金' },
            ]);
            const updates = {
              WECHAT_MINIAPP_APP_ID: 'wx1b33112db0d5267b',
              WECHAT_PAY_MCH_ID: '1603917538',
              WECHAT_PAY_PUBLIC_KEY_ID: keyId,
              WECHAT_PAY_PUBLIC_KEY: '',
              WECHAT_PAY_PUBLIC_KEY_PATH: 'certs/wechat/wechatpay_public_key.pem',
              WECHAT_TRANSFER_ENABLED: enabled,
              WECHAT_TRANSFER_NOTIFY_URL: 'https://test-api.ai-maimai.com/api/v1/bonus/withdraw/wechat/notify',
              WECHAT_TRANSFER_SCENE_ID: '1005',
              WECHAT_TRANSFER_REMARK: 'AI爱买买佣金报酬提现',
              WECHAT_TRANSFER_USER_RECV_PERCEPTION: '劳务报酬',
              WECHAT_TRANSFER_SCENE_REPORT_INFOS_JSON: reportInfos,
            };
            const targetKeys = new Set(Object.keys(updates));
            const current = fs.readFileSync('.env', 'utf8').split(/\r?\n/)
              .filter((line) => !targetKeys.has(line.match(/^([A-Z0-9_]+)=/)?.[1]));
            const rendered = Object.entries(updates).map(([key, value]) => {
              if (key === 'WECHAT_TRANSFER_SCENE_REPORT_INFOS_JSON') return `${key}='${value}'`;
              return `${key}=${JSON.stringify(value)}`;
            });
            fs.writeFileSync('.env.next', [...current, '', ...rendered, ''].join('\n'), { mode: 0o600 });
            fs.renameSync('.env.next', '.env');
            fs.chmodSync('.env', 0o600);
          NODE

            node <<'NODE'
            require('dotenv').config({ path: '.env', override: true });
            const fs = require('fs');
            const path = require('path');
            const { createPrivateKey, createPublicKey } = require('crypto');
            const { PrismaClient } = require('@prisma/client');
            const fail = (condition, message) => { if (!condition) throw new Error(message); };
            const readPem = (inlineName, pathName) => {
              const inline = (process.env[inlineName] || '').trim();
              if (inline) return inline.replace(/\\n/g, '\n');
              const configured = (process.env[pathName] || '').trim();
              return configured ? fs.readFileSync(path.resolve(process.cwd(), configured), 'utf8') : '';
            };

            fail(process.env.WECHAT_MINIAPP_APP_ID === 'wx1b33112db0d5267b', 'mini program app id mismatch');
            fail(process.env.WECHAT_PAY_MCH_ID === '1603917538', 'merchant id mismatch');
            fail((process.env.WECHAT_PAY_API_V3_KEY || '').length === 32, 'APIv3 key invalid');
            fail(Boolean(process.env.WECHAT_PAY_MERCHANT_CERT_SERIAL), 'merchant certificate serial missing');
            fail(/^PUB_KEY_ID_\d+$/.test(process.env.WECHAT_PAY_PUBLIC_KEY_ID || ''), 'WeChat public key id invalid');
            fail(process.env.WECHAT_TRANSFER_SCENE_ID === '1005', 'transfer scene mismatch');
            fail(process.env.WECHAT_TRANSFER_USER_RECV_PERCEPTION === '劳务报酬', 'recipient perception mismatch');
            fail(process.env.WECHAT_TRANSFER_NOTIFY_URL === 'https://test-api.ai-maimai.com/api/v1/bonus/withdraw/wechat/notify', 'notify url mismatch');
            const reports = JSON.parse(process.env.WECHAT_TRANSFER_SCENE_REPORT_INFOS_JSON || '[]');
            const map = new Map(reports.map((item) => [item.info_type, item.info_content]));
            fail(map.size === 2 && map.get('岗位类型') === '平台推广人员'
              && map.get('报酬说明') === 'AI爱买买平台推广佣金', 'scene report mismatch');
            fail(createPrivateKey(readPem('WECHAT_PAY_MERCHANT_PRIVATE_KEY', 'WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH')).asymmetricKeyType === 'rsa', 'merchant private key invalid');
            fail(createPublicKey(readPem('WECHAT_PAY_PUBLIC_KEY', 'WECHAT_PAY_PUBLIC_KEY_PATH')).asymmetricKeyType === 'rsa', 'WeChat public key invalid');

            const prisma = new PrismaClient();
            const unwrap = (value, fallback) => value && typeof value === 'object' && !Array.isArray(value)
              ? (value.value ?? fallback) : (value ?? fallback);
            (async () => {
              const rows = await prisma.ruleConfig.findMany({
                where: { key: { in: ['WITHDRAW_TAX_RATE', 'WITHDRAW_PROVIDER_FEE_AMOUNT'] } },
              });
              const values = new Map(rows.map((row) => [row.key, row.value]));
              fail(Number(unwrap(values.get('WITHDRAW_TAX_RATE'), 0.2)) === 0.2, 'withdraw tax rate must be 20%');
              fail(Number(unwrap(values.get('WITHDRAW_PROVIDER_FEE_AMOUNT'), 0)) === 0, 'withdraw provider fee must be zero');
              const schema = await prisma.$queryRawUnsafe(`
                SELECT
                  to_regclass('"WechatTransferNotifyInbox"') IS NOT NULL AS "hasInbox",
                  EXISTS (
                    SELECT 1 FROM information_schema.columns
                    WHERE table_schema = current_schema()
                      AND table_name = 'WithdrawRequest'
                      AND column_name = 'nextReconcileAt'
                  ) AS "hasReconcileSchedule"
              `);
              fail(schema[0]?.hasInbox === true, 'WeChat notify inbox migration missing');
              fail(schema[0]?.hasReconcileSchedule === true, 'withdraw reconcile migration missing');
              console.log('wechat_transfer_preflight=valid');
              console.log('withdraw_tax_rate=20%');
              console.log('withdraw_provider_fee=0');
            })().finally(() => prisma.$disconnect()).catch((error) => {
              console.error(error.message);
              process.exitCode = 1;
            });
          NODE

            pm2 reload "$PM2_NAME" --update-env
            API_PORT=$(sed -n 's/^PORT=//p' .env | tail -n 1 | tr -d '\r"')
            case "$API_PORT" in ''|*[!0-9]*) API_PORT=3000 ;; esac
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/api/v1/products?page=1&pageSize=1" >/dev/null; then
                echo "staging_wechat_transfer_reload=healthy"
                exit 0
              fi
              sleep 2
            done
            pm2 logs "$PM2_NAME" --lines 100 --nostream || true
            exit 1
          REMOTE

  # 华海农科母公司官网（静态 HTML，只在 main 分支部署到生产）
  deploy-huahai:
    needs: detect-changes
    if: needs.detect-changes.outputs.huahai == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy huahai corporate site
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: huahai-corporate-site/
          TARGET: /www/wwwroot/huahainongke.com/
          ARGS: -avz --delete --exclude='.htaccess' --exclude='.user.ini' --exclude='404.html'
