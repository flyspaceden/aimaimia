name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, staging, staging-next]
  push:
    branches: [dev, main]

env:
  NODE_ENV: test
  CAPTCHA_BYPASS_TOKEN: etest1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aimaimai_test
  JWT_SECRET: e2e-buyer-jwt-secret-20260822-0001
  ADMIN_JWT_SECRET: e2e-admin-jwt-secret-20260822-0002
  SELLER_JWT_SECRET: e2e-seller-jwt-secret-20260822-0003
  SF_ENV: UAT
  SF_ALLOW_E2E_MOCK: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aimaimai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            seller/package-lock.json
            tests/package-lock.json

      - name: Validate production release contracts
        run: |
          node --test \
            scripts/__tests__/deploy-backend-main-safety.test.mjs \
            scripts/__tests__/production-delivery-exclusion.test.mjs \
            scripts/__tests__/miniapp-staging-semantic-parity.test.mjs \
            scripts/__tests__/sync-staging-test-checkout.test.mjs

      # 并行安装依赖
      - name: Install dependencies
        run: |
          cd backend && npm ci &
          cd admin && npm ci &
          cd seller && npm ci &
          cd tests && npm ci &
          wait

      # Playwright 浏览器
      - name: Install Playwright browsers
        run: cd tests && npx playwright install chromium --with-deps

      # 数据库 migration + seed：发布门禁必须验证真实迁移链，禁止用 db push 掩盖 migration 缺口。
      - name: Setup database
        run: |
          cd backend
          npx --no-install prisma migrate deploy
          npx --no-install prisma generate
          npx --no-install prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # 跑测试（playwright 自动启动 backend + admin + seller）
      - name: Run E2E tests
        run: cd tests && npx playwright test --reporter=html,github
        env:
          SKIP_DB_RESET: "true"
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "CI automated test"

      # 上传报告和失败截图
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/test-results/
            tests/playwright-report/
          retention-days: 7
