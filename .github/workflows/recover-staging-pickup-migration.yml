name: Recover failed staging pickup migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mark-rolled-back:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Mark the known failed migration as rolled back
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /www/wwwroot/aimaimai-staging-src/backend
            npx prisma migrate resolve --rolled-back 20260816010000_add_platform_hub_pickup_points
            npx prisma migrate status
          REMOTE
