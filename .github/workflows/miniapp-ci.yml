name: Buyer Frontend CI

on:
  pull_request:
    branches: [main, staging, staging-next]
  push:
    branches: [main, staging, staging-next]
  workflow_dispatch:
    inputs:
      environment:
        description: Miniapp build target (App source follows its branch)
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      miniapp: ${{ steps.scope.outputs.miniapp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify scope and gate regression
        run: node --test scripts/__tests__/ci-release-scope.test.mjs
      - name: Select affected frontends
        id: scope
        env:
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_EVENT: ${{ github.event_name }}
        run: node scripts/ci-release-scope.mjs

  app-checks:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: App types, related tests and Android/iOS export
        env:
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BUILD_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/ci-frontend-checks.mjs --client app
      - uses: actions/upload-artifact@v4
        with:
          name: aimai-app-${{ github.sha }}
          path: dist/app-export/
          if-no-files-found: error
          retention-days: 14

  miniapp-checks:
    needs: scope
    if: needs.scope.outputs.miniapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
        working-directory: miniapp
      - name: Miniapp types, affected lint/tests and build
        env:
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_EVENT: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BUILD_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/ci-frontend-checks.mjs --client miniapp
      - uses: actions/upload-artifact@v4
        with:
          name: aimai-miniapp-${{ github.ref == 'refs/heads/main' && 'production' || github.event_name == 'pull_request' && 'review' || 'staging' }}-${{ github.sha }}
          path: miniapp/dist/
          if-no-files-found: error
          retention-days: 14

  # main 继续要求唯一的 checks；受影响端必须成功，未受影响端必须明确 skipped。
  checks:
    needs: [scope, app-checks, miniapp-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require successful affected frontend validation
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_APP_REQUIRED: ${{ needs.scope.outputs.app }}
          CI_MINIAPP_REQUIRED: ${{ needs.scope.outputs.miniapp }}
          CI_APP_RESULT: ${{ needs.app-checks.result }}
          CI_MINIAPP_RESULT: ${{ needs.miniapp-checks.result }}
        run: node scripts/ci-release-scope.mjs --assert-frontend-result
