# 独立交易门户；证书完成签发后安装，部署产物不包含本配置。
server {
    listen 80;
    server_name market.huahainongke.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-huahai-market;
        try_files $uri =404;
    }
    location / { return 301 https://market.huahainongke.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name market.huahainongke.com;
    ssl_certificate /etc/letsencrypt/live/market.huahainongke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.huahainongke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/market.huahainongke.com;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location ~ /\. { deny all; }
    # 真实监测数据：由取回定时任务写在网站发布目录之外，只提供两种文件名，其余 /live/ 一律 404。
    location ~ ^/live/v1/(index|pond-[a-z0-9]+-[a-z0-9]+)\.json$ {
        alias /var/www/huahai-market-live/v1/$1.json;
        limit_except GET HEAD { deny all; }
        types { }
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
    location /live/ { return 404; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    access_log /www/wwwlogs/market.huahainongke.com.log;
    error_log /www/wwwlogs/market.huahainongke.com.error.log;
}
