# 独立交易门户；证书完成签发后安装，部署产物不包含本配置。
server {
    listen 80;
    server_name market.huahainongke.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-huahai-market;
        try_files $uri =404;
    }
    location / { return 301 https://market.huahainongke.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name market.huahainongke.com;
    ssl_certificate /etc/letsencrypt/live/market.huahainongke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market.huahainongke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/market.huahainongke.com;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location ~ /\. { deny all; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    access_log /www/wwwlogs/market.huahainongke.com.log;
    error_log /www/wwwlogs/market.huahainongke.com.error.log;
}
