<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="华海农科 AI 农贸市场演示版：每一件水产都绑定养殖批次，可查看公司、基地、塘口、饲料、水质与检测报告。">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f8f6">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>首页 | 华海农科 AI 农贸市场</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
<noscript><p class="nojs">请启用 JavaScript 浏览本演示网站。本网站为演示版，不提供真实交易。</p></noscript>
<div id="app">
  <a class="skip" href="#view">跳到主要内容</a>
  <div class="demo-strip">标有“实时数据”的是真实监测数据，其余为演示 · 不产生真实交易</div>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#home" aria-label="华海农科 AI 农贸市场首页">
        <img class="logo" src="assets/logo.jpg" width="36" height="36" alt="">
        <span><strong>华海农科</strong><small>AI 农贸市场</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="主导航">
        <a href="#home" data-nav="home">首页</a>
        <a href="#shop" data-nav="shop">买好货</a>
        <a href="#bases" data-nav="bases">产地基地</a>
        <a href="#trace" data-nav="trace">溯源查询</a>
        <a href="#source" data-nav="source">产地采购</a>
        <a href="#work" data-nav="work">工作台</a>
      </nav>
      <div class="top-actions">
        <button class="btn btn-ghost btn-sm" data-action="assistant" aria-label="打开 AI 溯源助手"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span class="hide-sm">AI 助手</span></button>
        <a class="btn btn-ghost btn-sm cart-btn" href="#cart" data-nav="cart" aria-label="购物车"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12h11l2-8H6.2"/></svg><span class="badge mono" id="cart-count" hidden>0</span></a>
        <button class="btn btn-ghost btn-sm menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="展开导航"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"><p class="loading">正在载入…</p></main>
  <footer class="footer">
    <div><strong>华海农科 AI 农贸市场</strong><span>物联网监测 · 确权记录 · 批次溯源 · 产销直连</span></div>
    <div class="muted xs">标“实时数据”的为物联网真实监测数据；商品与交易为演示，未接入真实支付或物流 · <a href="https://huahainongke.com/" target="_blank" rel="noopener noreferrer">访问华海农科集团官网</a></div>
  </footer>

  <aside class="ai-panel glass" id="ai-panel" hidden aria-labelledby="ai-title">
    <div class="ai-head"><b id="ai-title">AI 溯源助手</b><span class="tag tag-demo">演示</span><button class="btn btn-icon" data-action="ai-close" aria-label="关闭 AI 助手"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="ai-log" id="ai-log" aria-live="polite"></div>
    <div class="ai-chips" id="ai-chips"></div>
    <form class="ai-form" id="ai-form"><label class="sr-only" for="ai-input">向 AI 提问</label><input id="ai-input" maxlength="200" autocomplete="off" placeholder="问问这批货…"><button class="btn btn-primary btn-icon" type="submit" aria-label="发送"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg></button></form>
    <p class="xs muted ai-note">演示版为预设回答，只引用档案中的数据。</p>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dlg" class="dlg glass" aria-labelledby="dlg-title">
    <div class="row"><h2 id="dlg-title"></h2><button class="btn btn-icon" data-action="dlg-close" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="dlg-body"></div>
  </dialog>
</div>

</html>
