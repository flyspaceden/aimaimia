# 放入官网现有 extension include；共享区文件须在 http 上下文加载。
location = /jjxmx {
    if ($scheme = http) { return 301 https://huahainongke.com$request_uri; }
    client_max_body_size 4k;
    content_by_lua_file /www/server/huahai-economics/gate.lua;
}
location ^~ /jjxmx/ {
    if ($scheme = http) { return 301 https://huahainongke.com$request_uri; }
    client_max_body_size 4k;
    content_by_lua_file /www/server/huahai-economics/gate.lua;
}
